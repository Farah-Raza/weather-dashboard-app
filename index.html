<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    autofocus
                />
                <button id="searchBtn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>

            <!-- Recent Searches -->
            <div class="recent-searches" id="recentSearches">
                <h3>Recent Searches:</h3>
                <div id="recentList"></div>
            </div>
        </section>

        <!-- Weather Display -->
        <section class="weather-display" id="weatherDisplay">
            <!-- Weather Card -->
            <div class="weather-card" id="weatherCard">
                <div class="city-name" id="cityName">--</div>
                <div class="date-time" id="dateTime">--</div>
                <div class="weather-icon" id="weatherIcon">
                    <i class="fas fa-cloud"></i>
                </div>
                <div class="temperature" id="temperature">--°C</div>
                <div class="weather-description" id="description">--</div>

                <div class="weather-details">
                    <div class="detail">
                        <i class="fas fa-tint"></i>
                        <span>Humidity</span>
                        <span id="humidity">--%</span>
                    </div>
                    <div class="detail">
                        <i class="fas fa-wind"></i>
                        <span>Wind Speed</span>
                        <span id="windSpeed">-- km/h</span>
                    </div>
                    <div class="detail">
                        <i class="fas fa-compress-alt"></i>
                        <span>Pressure</span>
                        <span id="pressure">-- hPa</span>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h3><i class="fas fa-calendar-alt"></i> 5-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid">
                    <!-- Forecast cards will be added by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Loading Spinner -->
        <div class="loader" id="loader" style="display: none;">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">City not found!</span>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
